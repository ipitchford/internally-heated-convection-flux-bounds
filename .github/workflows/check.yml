name: Supporting replay
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.4.4 scipy==1.17.1 sympy==1.14.0 matplotlib==3.10.8 mpmath==1.3.0
      - run: python code/test_publication.py
        env:
          OPENBLAS_NUM_THREADS: '1'
          MPLCONFIGDIR: /tmp/ihc-mpl
